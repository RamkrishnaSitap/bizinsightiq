spring:
  application:
    name: bizinsightiq-backend-test
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:bizinsightiq_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: BizInsightIQTestSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!
    expiration-ms: 3600000
  storage:
    upload-dir: target/test-uploads
  fastapi:
    base-url: http://localhost:8000/api/v1
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  cors:
    allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
