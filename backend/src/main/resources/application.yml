server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: bizinsightiq-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bizinsightiq_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:bizinsight_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:bizinsight@123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 500
          order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:BizInsightIQLocalDevelopmentSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://127.0.0.1:8000/api/v1}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
  storage:
    upload-dir: ${UPLOAD_DIR:data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:8501}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
# ---------------------------------------------------------------------------
# Production and Staging Profile Safety Override
# Fails fast at startup if SPRING_DATASOURCE_PASSWORD is not explicitly provided.
# No hardcoded default credentials are accepted outside local development.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod,staging
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD}

